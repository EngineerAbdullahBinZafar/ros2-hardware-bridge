name: CI — Build & Quality (C11, C++17 & Python)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ─── Job 1: C11 Firmware & C++17 Codec (ASan + UBSan) ───────────────────────
  build-test-c-cpp:
    name: ⚙️ Build & Test C11 Firmware + C++17 Codec (GCC + CMake)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GCC, G++ & CMake
        run: sudo apt-get update && sudo apt-get install -y gcc g++ cmake make

      - name: Build & Execute CMake Tests
        run: |
          mkdir -p build && cd build
          cmake ..
          make -j$(nproc)
          ctest --output-on-failure

      - name: Run AddressSanitizer & UBSan Strict Checks
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -Ifirmware -Ifirmware/include -c \
            firmware/src/ros2_bridge_fsm.c -o /tmp/ros2_bridge_fsm.o
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -Ifirmware -Ifirmware/include -c \
            firmware/src/stm32_uart_dma.c -o /tmp/stm32_uart_dma.o
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -Ifirmware -Ifirmware/include \
            /tmp/ros2_bridge_fsm.o /tmp/stm32_uart_dma.o firmware/tests/test_e2e_c.c -o /tmp/test_c_san
          /tmp/test_c_san
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -Ifirmware -Ifirmware/include -Iros2_cpp/include -c \
            ros2_cpp/tests/test_serial_e2e_cpp.cpp -o /tmp/test_serial_e2e_cpp.o
          g++ -fsanitize=address,undefined \
            /tmp/ros2_bridge_fsm.o /tmp/stm32_uart_dma.o /tmp/test_serial_e2e_cpp.o -o /tmp/test_cpp_san
          /tmp/test_cpp_san

  # ─── Job 2: Python Quality & Unit Tests ─────────────────────────────────────
  lint-and-test-python:
    name: 🧪 Python Lint (flake8) & Unit Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest

      - name: Run flake8 (syntax & error checks)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run pytest suite
        run: python -m pytest test/ -v --tb=short
