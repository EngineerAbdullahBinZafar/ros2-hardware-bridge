<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f17"/>
    </linearGradient>
    <linearGradient id="topBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#0055ff"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <style>
      .h1 { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 17px; font-weight: 800; fill: #f8fafc; letter-spacing: 0.8px; }
      .sub { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #00d4ff; font-weight: 700; }
      .bh { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #ffffff; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; fill: #cbd5e1; }
      .pin { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; fill: #f59e0b; font-weight: 700; }
      .ok { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; fill: #10b981; font-weight: 700; }
      .crit { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; fill: #ef4444; font-weight: 700; }
    </style>
  </defs>

  <rect x="2" y="2" width="956" height="456" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="2" y="2" width="956" height="4" rx="2" fill="url(#topBar)"/>

  <text x="26" y="34" class="h1">STM32F4 / ESP32 HARDWARE WIRING TOPOLOGY &amp; AUTOSAR E2E BUS INTERFACE</text>
  <text x="26" y="54" class="sub">GALVANIC ISOLATION (ADuM1201) · DMA UART (921.6 kbaud) · SN65HVD230 CAN 2.0B · WATCHDOG E-STOP INTERLOCK</text>

  <!-- Block 1: ROS 2 Host SBC -->
  <rect x="26" y="80" width="210" height="230" rx="8" fill="#0f172a" stroke="#00d4ff" stroke-width="1.4"/>
  <rect x="26" y="80" width="210" height="26" rx="8" fill="#0369a1" fill-opacity="0.45"/>
  <text x="38" y="98" class="bh">ROS 2 Host (C++17 / Python)</text>
  <text x="38" y="124" class="m">• Ubuntu Linux (Jetson / x86)</text>
  <text x="38" y="144" class="m">• SerialE2ECodec (ros2_cpp)</text>
  <text x="38" y="164" class="m">• /cmd_vel -&gt; MSG_ID 0x01</text>
  <text x="38" y="184" class="m">• /imu/data &lt;- MSG_ID 0x12</text>
  <text x="38" y="212" class="pin">TXD (921.6 kbps 8N1)</text>
  <text x="38" y="232" class="pin">RXD (COBS + CRC-8)</text>
  <text x="38" y="252" class="m">GND_HOST (5V USB-CDC)</text>
  <text x="38" y="294" class="ok">d_H &gt;= 4 (SAE J1850 0x1D)</text>

  <!-- Block 2: Galvanic Isolator -->
  <rect x="268" y="120" width="125" height="148" rx="8" fill="#1e1b4b" stroke="#7b61ff" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="280" y="142" class="bh">ADuM1201</text>
  <text x="280" y="160" class="m">2.5 kVrms</text>
  <text x="280" y="176" class="m">Magnetic</text>
  <text x="280" y="192" class="m">Isolation</text>
  <text x="280" y="220" class="pin">Ch A: Host-&gt;MCU</text>
  <text x="280" y="240" class="pin">Ch B: MCU-&gt;Host</text>
  <text x="280" y="258" class="m">Eliminates Loops</text>

  <!-- Wires 1 <-> 2 -->
  <line x1="236" y1="208" x2="268" y2="208" stroke="#f59e0b" stroke-width="2"/>
  <line x1="236" y1="228" x2="268" y2="228" stroke="#00d4ff" stroke-width="2"/>

  <!-- Block 3: STM32F407VG MCU -->
  <rect x="425" y="80" width="265" height="230" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.6"/>
  <rect x="425" y="80" width="265" height="26" rx="8" fill="#065f46" fill-opacity="0.5"/>
  <text x="438" y="98" class="bh">STM32F407VG (Cortex-M4 @ 168 MHz)</text>
  <text x="438" y="124" class="pin">PA9  (USART1_TX) &lt;- DMA2_Stream7</text>
  <text x="438" y="144" class="pin">PA10 (USART1_RX) -&gt; 512B SPSC Ring</text>
  <text x="438" y="166" class="m">• 7-State Auto-Resync FSM (&lt;35 us)</text>
  <text x="438" y="186" class="m">• Zero Heap Alloc (Static Buffers)</text>
  <text x="438" y="212" class="pin">PB9  (CAN1_TX) | PB8 (CAN1_RX)</text>
  <text x="438" y="232" class="pin">TIM2 (1 kHz PWM) | PB12 E-STOP IRQ</text>
  <text x="438" y="256" class="ok">3.3V Digital LDO (&lt;50 mV Ripple)</text>
  <text x="438" y="294" class="ok">Watchdog Timeout: 50 ms Hardware</text>

  <!-- Wires 2 <-> 3 -->
  <line x1="393" y1="120" x2="425" y2="120" stroke="#00d4ff" stroke-width="2"/>
  <line x1="393" y1="208" x2="425" y2="140" stroke="#f59e0b" stroke-width="2"/>

  <!-- Block 4: CAN Transceiver + Actuators -->
  <rect x="722" y="80" width="212" height="110" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.4"/>
  <rect x="722" y="80" width="212" height="26" rx="8" fill="#78350f" fill-opacity="0.5"/>
  <text x="734" y="98" class="bh">SN65HVD230 CAN Bus</text>
  <text x="734" y="124" class="m">• 500 kbps / 1 Mbps ISO 11898-2</text>
  <text x="734" y="144" class="pin">CAN_H / CAN_L (120 Ohm Term)</text>
  <text x="734" y="164" class="m">• Common-Mode Choke + TVS Diode</text>
  <text x="734" y="182" class="m">• Servo Nodes / Motor ESCs</text>

  <line x1="690" y1="135" x2="722" y2="135" stroke="#f59e0b" stroke-width="2"/>

  <!-- Block 5: Hardware E-Stop Interlock -->
  <rect x="722" y="205" width="212" height="105" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="722" y="205" width="212" height="26" rx="8" fill="#7f1d1d" fill-opacity="0.5"/>
  <text x="734" y="223" class="bh">Hardware E-Stop Relay</text>
  <text x="734" y="248" class="crit">• NC Safety Loop + MOSFET Cutoff</text>
  <text x="734" y="268" class="m">• Cuts 24V Gate Drive on CRC/WDT Fault</text>
  <text x="734" y="294" class="ok">Fail-Safe Latency &lt; 100 us</text>

  <line x1="690" y1="248" x2="722" y2="248" stroke="#ef4444" stroke-width="2"/>

  <!-- Bottom Memory & Frame Timing Footer -->
  <rect x="26" y="330" width="908" height="104" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
  <text x="42" y="354" class="sub">AUTOSAR E2E PROFILE 1 WIRE FRAME LAYOUT (TOTAL = 6 + N BYTES | MAX PAYLOAD N = 64B)</text>

  <!-- Frame Cells -->
  <rect x="42" y="368" width="110" height="46" rx="4" fill="#1e293b" stroke="#00d4ff" stroke-width="1"/>
  <text x="52" y="388" class="pin">SYNC (2B)</text>
  <text x="52" y="404" class="m">0xAA 0x55</text>

  <rect x="158" y="368" width="110" height="46" rx="4" fill="#1e293b" stroke="#7b61ff" stroke-width="1"/>
  <text x="168" y="388" class="bh">MSG_ID (1B)</text>
  <text x="168" y="404" class="m">0x00 .. 0x1F</text>

  <rect x="274" y="368" width="130" height="46" rx="4" fill="#1e293b" stroke="#7b61ff" stroke-width="1"/>
  <text x="284" y="388" class="bh">SEQ_CTR (1B)</text>
  <text x="284" y="404" class="m">4-bit Alive [0..15]</text>

  <rect x="410" y="368" width="105" height="46" rx="4" fill="#1e293b" stroke="#7b61ff" stroke-width="1"/>
  <text x="420" y="388" class="bh">LEN (1B)</text>
  <text x="420" y="404" class="m">0 .. 64 bytes</text>

  <rect x="521" y="368" width="240" height="46" rx="4" fill="#064e3b" fill-opacity="0.35" stroke="#10b981" stroke-width="1"/>
  <text x="536" y="388" class="ok">PAYLOAD (0 .. 64 Bytes)</text>
  <text x="536" y="404" class="m">Twist float32[2] / IMU float32[6]</text>

  <rect x="767" y="368" width="150" height="46" rx="4" fill="#7f1d1d" fill-opacity="0.35" stroke="#ef4444" stroke-width="1.2"/>
  <text x="779" y="388" class="crit">E2E CRC-8 (1B)</text>
  <text x="779" y="404" class="m">SAE J1850 (0x1D)</text>
</svg>